name: Octopus
options:
  bundleIdPrefix: com.octopus
  deploymentTarget:
    iOS: "17.0"
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
packages:
  ConvexMobile:
    url: https://github.com/get-convex/convex-swift
    from: 0.8.0
targets:
  Octopus:
    type: application
    platform: iOS
    sources:
      - Octopus
    dependencies:
      - package: ConvexMobile
        product: ConvexMobile
    info:
      path: Octopus/Info.plist
      properties:
        CFBundleDisplayName: Octopus
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        CONVEX_URL: $(CONVEX_URL)
        NSCameraUsageDescription: Octopus uses the camera to read your menu.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.octopus.shop
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64

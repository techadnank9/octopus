          step_description: Type "4.50" in the Price field.
        - type: instructions
          step_description: Tap Save.
        - type: validation
          step_description: The "Your menu" section lists "Latte" with a price.
        - type: instructions
          step_description: Tap "Add item" in the "Your menu" section.
        - type: instructions
          step_description: Type "Croissant" in the Name field.
        - type: instructions
          step_description: Type "3.25" in the Price field.
        - type: instructions
          step_description: Tap Save.
        - type: validation

test:
    metadata:
        name: order-arrives-live
        platform: ios
        tags:
            - orders
    build:
        name: octopus ios
    blocks:
        - type: instructions
          step_description: Wait until the loading spinner is gone and either the welcome screen with a "Shop name" field or the tab bar is showing.
        - type: if
          condition: Is the welcome screen with a "Shop name" text field visible?
          then:
            - type: instructions
              step_description: Type "Revyl Test Shop" in the "Shop name" field.
            - type: instructions
              step_description: Tap the primary button below the fields that sets up the shop (labelled "Set up my shop" or "Continue").
        - type: validation
          step_description: The tab bar with Orders, Menu, Number, Arms and Octopus tabs is visible.
        - type: instructions
          step_description: Open the Menu tab.
        - type: if
          condition: Is the "Your menu" section empty, showing no items above the "Add item" row?
          then:
            - type: instructions
              step_description: Tap "Add item".
            - type: instructions
              step_description: Type "Latte" in the Name field.
            - type: instructions
              step_description: Type "4.50" in the Price field.
            - type: instructions
              step_description: Tap Save.
        - type: validation
          step_description: The "Your menu" section lists at least one item with a price.
        - type: instructions
          step_description: Open the Orders tab.
        - type: instructions
          step_description: Tap "Add test order" in the top-right toolbar of the Orders screen.
        - type: validation
          step_description: An order card with a customer name, at least one line item, a total and the status "New" is visible on the Orders screen, without any refresh.

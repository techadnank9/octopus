name: OctopusShop
options:
  bundleIdPrefix: com.octopus
  deploymentTarget:
    iOS: "17.0"
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
packages:
  ConvexMobile:
    url: https://github.com/get-convex/convex-swift
    from: 0.8.0
targets:
  OctopusShop:
    type: application
    platform: iOS
    sources:
      - OctopusShop
    dependencies:
      - package: ConvexMobile
        product: ConvexMobile
    info:
      path: OctopusShop/Info.plist
      properties:
        CFBundleDisplayName: Octopus Shop
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        CONVEX_URL: $(CONVEX_URL)
        CFBundleURLTypes:
          - CFBundleURLName: com.octopus.customer
            CFBundleURLSchemes:
              - octopusshop
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.octopus.customer
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
